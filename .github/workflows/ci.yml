name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ats
          POSTGRES_PASSWORD: ats
          POSTGRES_DB: ats_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ats -d ats_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ats:ats@localhost:5432/ats_test
      LOG_LEVEL: warn
      JWT_EXPIRES_IN: 1h
      # This value protects nothing: it only signs tokens against a throwaway database in a
      # throwaway container, which is why it is acceptable to keep it in the repo.
      # Real secrets belong in GitHub Actions secrets, never in this file.
      JWT_SECRET: ci-only-dummy-secret-not-used-anywhere-0000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm test

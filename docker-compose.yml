services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ats
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Init scripts only run when the data volume is first created.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ats -d ats']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

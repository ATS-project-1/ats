name: CI Pipeline

on:
  push:
    branches: [ "main", "praise" ]
  pull_request:
    branches: [ "main", "praise" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ats_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Database Migrations
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/ats_test_db?schema=public"
        run: npx prisma migrate deploy

      - name: Build TypeScript Project
        run: npm run build

      - name: Run Tests
        env:
          PORT: 4000
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/ats_test_db?schema=public"
        run: npm test